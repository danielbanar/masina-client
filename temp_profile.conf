# Thermal profile for modem_alink: copy to /etc/temp_profile.conf on the camera (ALINK_TEMP_PROFILE to use another path).
# The SoC temperature (/sys/devices/virtual/mstar/msys/TEMP_R, degrees C) is looked up every <check> s; the first line
# it falls in caps the frame rate. A cooler line only takes over 2 degrees below the hotter one.
#
# <min>-<max>  <fps|->  <scale of the full rate|->  <check every s>
#   fps:   a fixed frame-rate cap, or - for none
#   scale: a share of the camera's full rate (0.5 = 60 -> 30), 1 or - for none
# Without this file modem_alink uses exactly these lines.
0-70     -    1      5
70-80    -    0.5    5
80-85    15   -      5
85-95    3    -      5
95-999   1    -      5